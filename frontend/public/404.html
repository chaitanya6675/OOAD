<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Smart E-Commerce | Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and redirects the browser to the index.html page
      // with the route encoded in the query string so GitHub Pages serves SPAs without 404s.
      var pathSegmentsToKeep = 1; // Preserves /OOAD/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 3rem; color: #64748b;">
    <p>Loading Smart E-Commerce Platform...</p>
  </body>
</html>
